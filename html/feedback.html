<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Відгук</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-sm navbar-dark bg-success">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">EcoLife</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="index.html">
            <i class="bi bi-house-door"></i> Головна
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">
            <i class="bi bi-phone"></i> Контакти
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">
            <i class="bi bi-chat"></i> Залишити відгук
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="feedback-container">
    <h2 class="text-center mb-4">Залиште ваш відгук</h2>
    <form id="feedbackForm" action="#" method="POST">
      <div class="mb-3">
        <label for="name" class="form-label">Ваше ім'я</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Ваша електронна пошта</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>

      <div class="mb-3">
        <label for="rating" class="form-label">Оцініть наш сайт</label>
        <select class="form-select" id="rating" name="rating">
          <option value="1">1 - Дуже погано</option>
          <option value="2">2 - Погано</option>
          <option value="3">3 - Середньо</option>
          <option value="4">4 - Добре</option>
          <option value="5">5 - Відмінно</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="feedback" class="form-label">Ваш відгук</label>
        <textarea class="form-control" id="feedback" name="feedback" rows="4" required></textarea>
      </div>

      <button type="submit" class="btn btn-success w-100">Відправити відгук</button>
    </form>
  </div>
</div>
<button id="scrollToTop" class="btn btn-primary rounded-circle" style="position: fixed; bottom: 20px; right: 20px; display: none; width: 50px; height: 50px;">
  <i class="bi bi-arrow-up"></i> <!-- Іконка для прокрутки вгору -->
</button>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="../js/bootstrap.bundle.min.js"></script>
<script src="../js/script.js"></script>
</body>
</html>
